services:
  - type: web
    name: ai-wastetwin-backend
    env: python
    region: oregon
    plan: free
    rootDirectory: backend
    buildCommand: pip install -r requirements.txt
    # FastAPI is an ASGI app, so we use uvicorn (not gunicorn/WSGI).
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    # (gunicorn is a WSGI server and cannot serve FastAPI directly)
    envVars:
      - key: PYTHON_VERSION
        value: "3.14"
